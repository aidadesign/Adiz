<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#faf9fd">
<title>ADIZ — прототип</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
  }

  body {
    margin: 0;
    font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #302b40;
    background: #faf9fd;
    overflow: hidden;
    overscroll-behavior: none;
  }

  header {
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: white;
    border-bottom: 1px solid #eeeaf4;
    position: relative;
    z-index: 10;
  }

  strong {
    color: #7852d6;
    letter-spacing: 3px;
    font-size: 21px;
  }

  #status {
    font-size: 12px;
    color: #756d85;
  }

  #board {
    position: fixed;
    inset: 54px 0 132px;
    overflow: hidden;
    background: #fff;
    touch-action: none;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 132px;
    padding: 10px 12px;
    background: #fff;
    border-top: 1px solid #eeeaf4;
    z-index: 10;
  }

  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    overflow-x: auto;
    white-space: nowrap;
    padding-bottom: 8px;
    scrollbar-width: none;
  }

  .row::-webkit-scrollbar {
    display: none;
  }

  button {
    border: 1px solid #e7e1f0;
    border-radius: 12px;
    padding: 10px 13px;
    background: white;
    color: inherit;
    cursor: pointer;
    flex-shrink: 0;
    font: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  button:active {
    transform: scale(.97);
  }

  button.active {
    background: #eee7ff;
    border-color: #ae91ed;
  }

  input[type=range] {
    width: 100px;
    accent-color: #8057d8;
    cursor: pointer;
  }

  #colorButton {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #sample {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #7252c7;
    border: 1px solid #ddd;
    flex-shrink: 0;
  }

  .control {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px;
    flex-shrink: 0;
  }

  .control span {
    color: #756d85;
    font-size: 12px;
  }

  .hint {
    color: #847b92;
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  dialog {
    border: 1px solid #eee;
    border-radius: 22px;
    padding: 22px;
    max-width: calc(100vw - 24px);
    width: 340px;
    box-shadow: 0 15px 70px #30204030;
    color: #302b40;
  }

  dialog::backdrop {
    background: #25183b35;
  }

  .dialog-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .dialog-subtitle {
    font-size: 12px;
    color: #847b92;
  }

  #wheel {
    width: 210px;
    height: 210px;
    border-radius: 50%;
    margin: 12px auto;
    touch-action: none;
    background:
      radial-gradient(circle, white, transparent 70%),
      conic-gradient(
        from 90deg,
        red,
        yellow,
        lime,
        cyan,
        blue,
        magenta,
        red
      );
    border: 1px solid #eee;
    position: relative;
    cursor: crosshair;
  }

  #dot {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2px solid white;
    box-shadow: 0 0 0 1px #555;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
  }

  #swatches {
    display: flex;
    gap: 8px;
    margin: 12px 0;
  }

  #swatches button {
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 50%;
  }

  #hex {
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 8px;
    width: 110px;
    font: inherit;
    text-transform: uppercase;
  }

  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 15px;
  }

  #sizeValue,
  #pressureValue {
    min-width: 30px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 600px) {
    header {
      padding: 0 12px;
    }

    #status {
      font-size: 11px;
    }

    footer {
      height: 132px;
      padding: 8px;
    }

    button {
      padding: 9px 11px;
    }

    .hint {
      font-size: 10px;
    }
  }
</style>
</head>

<body>

<header>
  <strong>ADIZ</strong>
  <span id="status">Локальный прототип</span>
</header>

<div id="board">
  <canvas id="canvas"></canvas>
</div>

<footer>

  <div class="row">

    <button class="tool active" data-tool="pen">Перо</button>
    <button class="tool" data-tool="brush">Ручка</button>
    <button class="tool" data-tool="pencil">Карандаш</button>
    <button class="tool" data-tool="watercolor">Акварель</button>
    <button class="tool" data-tool="eraser">Ластик</button>
    <button class="tool" data-tool="highlighter">Выделитель</button>

  </div>

  <div class="row">

    <button id="colorButton">
      <span id="sample"></span>
      Цвет
    </button>

    <div class="control">
      <span>Размер</span>
      <input
        id="size"
        type="range"
        min="1"
        max="80"
        value="6"
      >
      <span id="sizeValue">6</span>
    </div>

    <div class="control">
      <span>Нажим</span>
      <input
        id="pressure"
        type="range"
        min="0"
        max="100"
        value="50"
      >
      <span id="pressureValue">50</span>
    </div>

    <button id="undoButton">Отменить</button>
    <button id="clearButton">К началу</button>

  </div>

  <div class="hint">
    S Pen — рисование · два пальца — перемещение и масштаб
  </div>

</footer>


<!-- ОКНО ВЫБОРА ЦВЕТА -->

<dialog id="colorDialog">

  <div class="dialog-title">Цвет</div>
  <div class="dialog-subtitle">
    Выбери цвет или введи HEX
  </div>

  <div id="wheel">
    <div id="dot"></div>
  </div>

  <div id="swatches">
    <button data-color="#7252c7" style="background:#7252c7"></button>
    <button data-color="#302b40" style="background:#302b40"></button>
    <button data-color="#e64b4b" style="background:#e64b4b"></button>
    <button data-color="#f0a52b" style="background:#f0a52b"></button>
    <button data-color="#3caf75" style="background:#3caf75"></button>
    <button data-color="#3b82d0" style="background:#3b82d0"></button>
  </div>

  <input
    id="hex"
    type="text"
    value="#7252C7"
    maxlength="7"
    spellcheck="false"
  >

  <div class="dialog-actions">
    <button id="cancelColor">Отмена</button>
    <button id="applyColor" class="active">Готово</button>
  </div>

</dialog>


<script>
(() => {

  "use strict";

  /* =========================================================
     ELEMENTS
  ========================================================= */

  const canvas = document.getElementById("canvas");
  const board = document.getElementById("board");

  const ctx = canvas.getContext("2d", {
    alpha: false,
    desynchronized: true
  });

  const status = document.getElementById("status");

  const toolButtons = document.querySelectorAll(".tool");

  const sizeInput = document.getElementById("size");
  const sizeValue = document.getElementById("sizeValue");

  const pressureInput = document.getElementById("pressure");
  const pressureValue = document.getElementById("pressureValue");

  const undoButton = document.getElementById("undoButton");
  const clearButton = document.getElementById("clearButton");

  const colorButton = document.getElementById("colorButton");
  const sample = document.getElementById("sample");

  const colorDialog = document.getElementById("colorDialog");
  const wheel = document.getElementById("wheel");
  const dot = document.getElementById("dot");
  const hexInput = document.getElementById("hex");

  const swatchButtons = document.querySelectorAll("#swatches button");
  const cancelColor = document.getElementById("cancelColor");
  const applyColor = document.getElementById("applyColor");


  /* =========================================================
     STATE
  ========================================================= */

  let dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));

  let canvasWidth = 0;
  let canvasHeight = 0;

  let tool = "pen";
  let color = "#7252c7";

  let brushSize = 6;
  let pressureStrength = 0.5;

  let drawing = false;

  let activePointerId = null;

  let lastX = 0;
  let lastY = 0;

  let lastTime = 0;

  let strokes = [];

  let currentStroke = null;

  let panX = 0;
  let panY = 0;
  let zoom = 1;

  let lastPinchDistance = null;
  let lastPinchCenter = null;

  let pointers = new Map();

  let temporaryColor = color;


  /* =========================================================
     CANVAS
  ========================================================= */

  function resizeCanvas() {

    const rect = board.getBoundingClientRect();

    canvasWidth = rect.width;
    canvasHeight = rect.height;

    dpr = Math.max(
      1,
      Math.min(window.devicePixelRatio || 1, 3)
    );

    canvas.width = Math.round(canvasWidth * dpr);
    canvas.height = Math.round(canvasHeight * dpr);

    canvas.style.width = canvasWidth + "px";
    canvas.style.height = canvasHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    redraw();
  }


  window.addEventListener("resize", resizeCanvas);


  /* =========================================================
     COORDINATES
  ========================================================= */

  function screenToWorld(x, y) {

    return {
      x: (x - panX) / zoom,
      y: (y - panY) / zoom
    };

  }


  function worldToScreen(x, y) {

    return {
      x: x * zoom + panX,
      y: y * zoom + panY
    };

  }


  /* =========================================================
     DRAWING
  ========================================================= */

  function redraw() {

    ctx.save();

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.clearRect(
      0,
      0,
      canvasWidth,
      canvasHeight
    );

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
      0,
      0,
      canvasWidth,
      canvasHeight
    );

    ctx.translate(panX, panY);
    ctx.scale(zoom, zoom);

    for (const stroke of strokes) {

      drawStroke(stroke);

    }

    if (currentStroke) {

      drawStroke(currentStroke);

    }

    ctx.restore();

  }


  function drawStroke(stroke) {

    if (!stroke || stroke.points.length === 0) {
      return;
    }

    const points = stroke.points;

    const toolName = stroke.tool;

    ctx.save();

    if (toolName === "eraser") {

      ctx.globalCompositeOperation =
        "destination-out";

    } else {

      ctx.globalCompositeOperation =
        "source-over";

    }

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (toolName === "pencil") {

      ctx.globalAlpha = 0.75;

    }

    if (toolName === "watercolor") {

      ctx.globalAlpha = 0.18;

    }

    if (toolName === "highlighter") {

      ctx.globalAlpha = 0.28;
      ctx.globalCompositeOperation =
        "source-over";

    }

    ctx.strokeStyle =
      toolName === "eraser"
        ? "rgba(0,0,0,1)"
        : stroke.color;

    if (points.length === 1) {

      const p = points[0];

      const radius =
        getPointSize(stroke, p) / 2;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        radius,
        0,
        Math.PI * 2
      );

      if (toolName === "eraser") {
        ctx.fillStyle = "#000";
      } else {
        ctx.fillStyle = stroke.color;
      }

      ctx.fill();

      ctx.restore();

      return;
    }

    for (let i = 1; i < points.length; i++) {

      const p1 = points[i - 1];
      const p2 = points[i];

      const width =
        getPointSize(stroke, p2);

      ctx.lineWidth = width;

      ctx.beginPath();

      ctx.moveTo(p1.x, p1.y);

      const midX =
        (p1.x + p2.x) / 2;

      const midY =
        (p1.y + p2.y) / 2;

      ctx.quadraticCurveTo(
        p1.x,
        p1.y,
        midX,
        midY
      );

      ctx.stroke();

    }

    ctx.restore();

  }


  function getPointSize(stroke, point) {

    let multiplier = 1;

    if (stroke.tool === "watercolor") {
      multiplier = 2.3;
    }

    if (stroke.tool === "highlighter") {
      multiplier = 3;
    }

    if (stroke.tool === "pencil") {
      multiplier = 0.75;
    }

    if (stroke.tool === "eraser") {
      multiplier = 2;
    }

    const pressure =
      point.pressure > 0
        ? point.pressure
        : 0.5;

    const pressureEffect =
      0.65 +
      pressure * pressureStrength * 0.7;

    return Math.max(
      1,
      stroke.size *
      multiplier *
      pressureEffect
    );

  }


  /* =========================================================
     POINTER
  ========================================================= */

  function getPointerPosition(event) {

    const rect =
      canvas.getBoundingClientRect();

    return {
      x: event.clientX - rect.left,
      y: event.clientY - rect.top
    };

  }


  function getPressure(event) {

    if (
      typeof event.pressure === "number" &&
      event.pressure > 0
    ) {

      return Math.min(
        1,
        Math.max(0, event.pressure)
      );

    }

    return 0.5;

  }


  canvas.addEventListener(
    "pointerdown",
    event => {

      pointers.set(
        event.pointerId,
        {
          x: event.clientX,
          y: event.clientY
        }
      );

      canvas.setPointerCapture(
        event.pointerId
      );

      if (pointers.size >= 2) {

        drawing = false;
        currentStroke = null;

        initializePinch();

        redraw();

        return;

      }

      if (
        event.pointerType === "mouse" &&
        event.button !== 0
      ) {
        return;
      }

      activePointerId =
        event.pointerId;

      const position =
        getPointerPosition(event);

      const world =
        screenToWorld(
          position.x,
          position.y
        );

      drawing = true;

      lastX = world.x;
      lastY = world.y;

      lastTime = performance.now();

      currentStroke = {

        tool,
        color,
        size: brushSize,

        points: [
          {
            x: world.x,
            y: world.y,
            pressure: getPressure(event)
          }
        ]

      };

      redraw();

    }
  );


  canvas.addEventListener(
    "pointermove",
    event => {

      if (!pointers.has(event.pointerId)) {
        return;
      }

      pointers.set(
        event.pointerId,
        {
          x: event.clientX,
          y: event.clientY
        }
      );

      if (pointers.size >= 2) {

        drawing = false;
        currentStroke = null;

        handlePinch();

        return;

      }

      if (
        !drawing ||
        event.pointerId !== activePointerId
      ) {
        return;
      }

      const position =
        getPointerPosition(event);

      const world =
        screenToWorld(
          position.x,
          position.y
        );

      const now =
        performance.now();

      const distance =
        Math.hypot(
          world.x - lastX,
          world.y - lastY
        );

      if (distance < 0.4) {
        return;
      }

      const pressure =
        getPressure(event);

      currentStroke.points.push({

        x: world.x,
        y: world.y,
        pressure

      });

      lastX = world.x;
      lastY = world.y;
      lastTime = now;

      redraw();

    }
  );


  function finishStroke(event) {

    if (
      event &&
      event.pointerId !== activePointerId
    ) {
      return;
    }

    if (
      drawing &&
      currentStroke &&
      currentStroke.points.length
    ) {

      strokes.push(currentStroke);

    }

    drawing = false;

    currentStroke = null;

    activePointerId = null;

    redraw();

  }


  canvas.addEventListener(
    "pointerup",
    event => {

      pointers.delete(
        event.pointerId
      );

      if (pointers.size < 2) {

        lastPinchDistance = null;
        lastPinchCenter = null;

      }

      finishStroke(event);

    }
  );


  canvas.addEventListener(
    "pointercancel",
    event => {

      pointers.delete(
        event.pointerId
      );

      finishStroke(event);

    }
  );


  canvas.addEventListener(
    "pointerleave",
    event => {

      if (
        event.pointerType === "mouse" &&
        drawing
      ) {

        finishStroke(event);

      }

    }
  );


  /* =========================================================
     TWO-FINGER PAN + ZOOM
  ========================================================= */

  function initializePinch() {

    const values =
      Array.from(pointers.values());

    if (values.length < 2) {
      return;
    }

    const a = values[0];
    const b = values[1];

    lastPinchDistance =
      Math.hypot(
        b.x - a.x,
        b.y - a.y
      );

    lastPinchCenter = {

      x: (a.x + b.x) / 2,
      y: (a.y + b.y) / 2

    };

  }


  function handlePinch() {

    const values =
      Array.from(pointers.values());

    if (values.length < 2) {
      return;
    }

    const a = values[0];
    const b = values[1];

    const distance =
      Math.hypot(
        b.x - a.x,
        b.y - a.y
      );

    const center = {

      x: (a.x + b.x) / 2,
      y: (a.y + b.y) / 2

    };

    if (
      lastPinchDistance === null ||
      lastPinchCenter === null
    ) {

      lastPinchDistance = distance;
      lastPinchCenter = center;

      return;

    }

    const oldZoom = zoom;

    const scale =
      distance / lastPinchDistance;

    zoom *= scale;

    zoom =
      Math.max(
        0.25,
        Math.min(5, zoom)
      );

    const worldBefore =
      screenToWorld(
        center.x,
        center.y
      );

    panX +=
      center.x -
      lastPinchCenter.x;

    panY +=
      center.y -
      lastPinchCenter.y;

    const worldAfter =
      screenToWorld(
        center.x,
        center.y
      );

    panX +=
      (worldAfter.x - worldBefore.x) *
      zoom;

    panY +=
      (worldAfter.y - worldBefore.y) *
      zoom;

    lastPinchDistance = distance;
    lastPinchCenter = center;

    redraw();

    if (Math.abs(zoom - oldZoom) > 0.001) {

      status.textContent =
        "Масштаб: " +
        Math.round(zoom * 100) +
        "%";

    }

  }


  /* =========================================================
     TOOLS
  ========================================================= */

  toolButtons.forEach(button => {

    button.addEventListener(
      "click",
      () => {

        tool =
          button.dataset.tool;

        toolButtons.forEach(
          item =>
            item.classList.remove("active")
        );

        button.classList.add("active");

        const names = {

          pen: "Перо",
          brush: "Ручка",
          pencil: "Карандаш",
          watercolor: "Акварель",
          eraser: "Ластик",
          highlighter: "Выделитель"

        };

        status.textContent =
          names[tool] || "Локальный прототип";

      }
    );

  });


  /* =========================================================
     SIZE
  ========================================================= */

  sizeInput.addEventListener(
    "input",
    () => {

      brushSize =
        Number(sizeInput.value);

      sizeValue.textContent =
        brushSize;

    }
  );


  /* =========================================================
     PRESSURE
  ========================================================= */

  pressureInput.addEventListener(
    "input",
    () => {

      pressureStrength =
        Number(pressureInput.value) / 100;

      pressureValue.textContent =
        pressureInput.value;

    }
  );


  /* =========================================================
     UNDO
  ========================================================= */

  undoButton.addEventListener(
    "click",
    () => {

      if (!strokes.length) {

        status.textContent =
          "Отменять нечего";

        return;

      }

      strokes.pop();

      redraw();

      status.textContent =
        "Последнее действие отменено";

    }
  );


  /* =========================================================
     CLEAR / RESET
  ========================================================= */

  clearButton.addEventListener(
    "click",
    () => {

      if (!strokes.length) {

        panX = 0;
        panY = 0;
        zoom = 1;

        redraw();

        status.textContent =
          "Холст уже чист";

        return;

      }

      const confirmed =
        confirm(
          "Очистить холст и вернуть исходный масштаб?"
        );

      if (!confirmed) {
        return;
      }

      strokes = [];

      panX = 0;
      panY = 0;
      zoom = 1;

      redraw();

      status.textContent =
        "Холст очищен";

    }
  );


  /* =========================================================
     COLOR DIALOG
  ========================================================= */

  colorButton.addEventListener(
    "click",
    () => {

      temporaryColor = color;

      hexInput.value =
        color.toUpperCase();

      updateColorDot();

      if (
        typeof colorDialog.showModal === "function"
      ) {

        colorDialog.showModal();

      } else {

        colorDialog.setAttribute(
          "open",
          ""
        );

      }

    }
  );


  cancelColor.addEventListener(
    "click",
    () => {

      colorDialog.close();

    }
  );


  applyColor.addEventListener(
    "click",
    () => {

      const value =
        normalizeHex(hexInput.value);

      if (!value) {

        hexInput.focus();

        status.textContent =
          "Введите корректный HEX";

        return;

      }

      color = value;

      sample.style.background =
        color;

      colorDialog.close();

      status.textContent =
        "Цвет изменён";

    }
  );


  swatchButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          temporaryColor =
            button.dataset.color;

          hexInput.value =
            temporaryColor.toUpperCase();

          updateColorDot();

        }
      );

    }
  );


  /* =========================================================
     COLOR WHEEL
  ========================================================= */

  wheel.addEventListener(
    "pointerdown",
    event => {

      wheel.setPointerCapture(
        event.pointerId
      );

      selectWheelColor(event);

    }
  );


  wheel.addEventListener(
    "pointermove",
    event => {

      if (
        wheel.hasPointerCapture(
          event.pointerId
        )
      ) {

        selectWheelColor(event);

      }

    }
  );


  function selectWheelColor(event) {

    const rect =
      wheel.getBoundingClientRect();

    const x =
      event.clientX - rect.left;

    const y =
      event.clientY - rect.top;

    const centerX =
      rect.width / 2;

    const centerY =
      rect.height / 2;

    const dx =
      x - centerX;

    const dy =
      y - centerY;

    const radius =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    const maxRadius =
      rect.width / 2;

    if (radius > maxRadius) {
      return;
    }

    let angle =
      Math.atan2(dy, dx);

    angle =
      angle * 180 / Math.PI;

    if (angle < 0) {
      angle += 360;
    }

    /*
      Цветовой круг.
      Насыщенность зависит от расстояния
      от центра.
    */

    const hue =
      (angle + 90) % 360;

    const saturation =
      Math.min(
        100,
        radius / maxRadius * 100
      );

    const lightness =
      50;

    temporaryColor =
      hslToHex(
        hue,
        saturation,
        lightness
      );

    hexInput.value =
      temporaryColor.toUpperCase();

    dot.style.left =
      Math.max(
        7,
        Math.min(
          rect.width - 7,
          x
        )
      ) + "px";

    dot.style.top =
      Math.max(
        7,
        Math.min(
          rect.height - 7,
          y
        )
      ) + "px";

    dot.style.background =
      temporaryColor;

  }


  function updateColorDot() {

    dot.style.background =
      temporaryColor;

    /*
      Начальная позиция.
      Полностью точное положение HEX
      на колесе не вычисляем — цвет всё равно
      сохраняется через HEX.
    */

    dot.style.left = "50%";
    dot.style.top = "50%";

  }


  function normalizeHex(value) {

    let hex =
      String(value || "")
        .trim()
        .replace(/^#/, "");

    if (/^[0-9a-fA-F]{3}$/.test(hex)) {

      hex =
        hex
          .split("")
          .map(char => char + char)
          .join("");

    }

    if (!/^[0-9a-fA-F]{6}$/.test(hex)) {
      return null;
    }

    return "#" + hex.toUpperCase();

  }


  function hslToHex(h, s, l) {

    s /= 100;
    l /= 100;

    const c =
      (1 - Math.abs(2 * l - 1)) * s;

    const x =
      c *
      (
        1 -
        Math.abs(
          (h / 60) % 2 - 1
        )
      );

    const m =
      l - c / 2;

    let r = 0;
    let g = 0;
    let b = 0;

    if (h < 60) {
      r = c;
      g = x;
    } else if (h < 120) {
      r = x;
      g = c;
    } else if (h < 180) {
      g = c;
      b = x;
    } else if (h < 240) {
      g = x;
      b = c;
    } else if (h < 300) {
      r = x;
      b = c;
    } else {
      r = c;
      b = x;
    }

    const toHex =
      value =>
        Math.round(
          (value + m) * 255
        )
          .toString(16)
          .padStart(2, "0");

    return (
      "#" +
      toHex(r) +
      toHex(g) +
      toHex(b)
    ).toUpperCase();

  }


  /* =========================================================
     HEX INPUT
  ========================================================= */

  hexInput.addEventListener(
    "input",
    () => {

      const value =
        normalizeHex(hexInput.value);

      if (value) {

        temporaryColor = value;

        dot.style.background =
          temporaryColor;

      }

    }
  );


  hexInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        applyColor.click();

      }

    }
  );


  /* =========================================================
     PREVENT BROWSER GESTURES
  ========================================================= */

  document.addEventListener(
    "gesturestart",
    event => {
      event.preventDefault();
    },
    { passive: false }
  );

  document.addEventListener(
    "gesturechange",
    event => {
      event.preventDefault();
    },
    { passive: false }
  );

  document.addEventListener(
    "gestureend",
    event => {
      event.preventDefault();
    },
    { passive: false }
  );


  /* =========================================================
     KEYBOARD SHORTCUTS
  ========================================================= */

  document.addEventListener(
    "keydown",
    event => {

      /*
        Не перехватываем ввод текста.
      */

      if (
        event.target.tagName === "INPUT" ||
        event.target.tagName === "TEXTAREA"
      ) {
        return;
      }

      /*
        Ctrl/Cmd + Z
      */

      if (
        (event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase() === "z"
      ) {

        event.preventDefault();

        undoButton.click();

      }

      /*
        Горячие клавиши инструментов
      */

      const shortcuts = {

        p: "pen",
        b: "brush",
        k: "pencil",
        w: "watercolor",
        e: "eraser",
        h: "highlighter"

      };

      const selected =
        shortcuts[event.key.toLowerCase()];

      if (selected) {

        const button =
          document.querySelector(
            `[data-tool="${selected}"]`
          );

        if (button) {
          button.click();
        }

      }

    }
  );


  /* =========================================================
     INITIALIZATION
  ========================================================= */

  sample.style.background =
    color;

  sizeValue.textContent =
    sizeInput.value;

  pressureValue.textContent =
    pressureInput.value;

  resizeCanvas();

  status.textContent =
    "Локальный прототип";

})();
</script>

</body>
</html>
